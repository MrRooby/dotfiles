[compact-view]
default-zoom-level='largest'

[list-view]
default-column-order=['name', 'size', 'type', 'date_modified', 'date_created_with_time', 'date_accessed', 'date_created', 'detailed_type', 'group', 'where', 'mime_type', 'date_modified_with_time', 'octal_permissions', 'owner', 'permissions', 'selinux_context']
default-visible-columns=['name', 'size', 'type', 'date_modified', 'permissions']

[preferences]
default-folder-viewer='list-view'
inherit-folder-viewer=true
show-directory-item-counts='local-only'
show-edit-icon-toolbar=true
show-hidden-files=true
show-image-thumbnails='local-only'
show-new-folder-icon-toolbar=true
show-show-thumbnails-toolbar=false
sort-directories-first=false
thumbnail-limit=uint64 5242880

[search]
search-reverse-sort=true
search-sort-column='date_modified'

[sidebar-panels/tree]
show-only-directories=false

[window-state]
devices-expanded=true
geometry='796x596+0+0'
maximized=false
my-computer-expanded=true
network-expanded=true
side-pane-view='places'
sidebar-bookmark-breakpoint=4
sidebar-width=203
start-with-menu-bar=true
start-with-sidebar=true
start-with-status-bar=true
