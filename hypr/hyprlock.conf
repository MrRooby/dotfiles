$font = JetBrainsMono Nerd Font Propo
source= mocha.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    # keep fail/fingerprint messages on screen long enough to read
    fail_timeout = 3000
}

animations {
    enabled = false
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor = 
    path = ~/Pictures/wallpapers/odyssey.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.15
    noise = 0.011
}

# Profile Picture
image {
    monitor =
    path = ~/Pictures/profile/prof-mii.png
    size = 100
    border_size = 8
    border_color = $nixieOrange
    position = 0, 200
    halign = center
    valign = bottom
}

# user
label {
    monitor =
    text = $USER
    font_size = 14
    font_family = $font
    color = $text
    position = 0, 160
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 200, 30
    outline_thickness = 3
    inner_color = rgba($textAlpha33)

    outer_color = rgba($textAlpha33)
    check_color = $nixieOrange
    fail_color = rgba(ff0000ff)

    #font_color = rgba($textAlpha99)
    # also colours the typed dots
    font_color = rgba(ff8c00aa)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text =
    # $FAIL is the only thing that varies by cause, so it is what gives the
    # lockout its own message. Wording is hyprlock's own and cannot be customised:
    #   bad scan -> "Fingerprint did not match"
    #   locked   -> "Fingerprint auth disabled (too many failed attempts)"
    # $ATTEMPTS counts all failures, password ones included.
    fail_text = <span foreground="##ff0000">󰯧  $FAIL</span> <b>($ATTEMPTS)</b>

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 80
    halign = center
    valign = bottom
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint or enter password
        present_message = Scanning fingerprint...
        retry_delay = 250
    }
}

# TIME
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 120
    font_family = $font black
    position = 0, -200
    halign = center
    valign = top
    color = rgba($nixieOrangeAlpha)
}

# day
label {
    monitor =
    text = cmd[update:1000] date +"%a"
    font_size = 16
    font_family = $font
    position = -150, -380
    halign = center
    valign = top
    color = $text
}

# separator
