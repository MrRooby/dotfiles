general {
    # BARTOSZ: lock zawsze przez logind, nigdy bezposrednio - pidof pilnuje,
    # zeby idle, suspend i reczne `loginctl lock-session` nie odpalily
    # trzech hyprlockow na sobie (kazdy trzymalby wlasny claim na czytniku).
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = swaymsg "output * power on"
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
    on-resume = brightnessctl --restore
}

listener {
    timeout = 360
    on-timeout = swaymsg "output * power off"
    on-resume = swaymsg "output * power on"
}
