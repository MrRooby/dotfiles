general {
    # BARTOSZ: lock zawsze przez logind, nigdy bezposrednio - pidof pilnuje,
    # zeby idle, suspend i reczne `loginctl lock-session` nie odpalily
    # trzech hyprlockow na sobie (kazdy trzymalby wlasny claim na czytniku).
    # lock.sh = ten sam pidof + dzwiek blokady, potem hyprlock.
    lock_cmd = ~/.config/sway/scripts/lock.sh
    # kbd-backlight.sh: podswietlenie klawiatury gasnie po wybudzeniu, wiec
    # zapisz poziom przed snem i przywroc po. lock-session pierwszy - wraca od
    # razu, a save moze chwile poczekac na konczacy sie restore.
    before_sleep_cmd = loginctl lock-session; ~/.config/sway/scripts/kbd-backlight.sh save
    after_sleep_cmd = swaymsg "output * power on"; ~/.config/sway/scripts/kbd-backlight.sh restore
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
    on-resume = brightnessctl --restore
}

listener {
    timeout = 360
    on-timeout = swaymsg "output * power off"
    on-resume = swaymsg "output * power on"
}
