# nostromo palette for the waybar popups (wlctl, bluetui).
#
# Loaded by scripts/popup.sh on top of ~/.config/kitty/kitty.conf, so only
# the popups change -- the terminal on Super+Enter keeps its own look.
# The file is picked by the theme name on the first line of
# current-theme.css, the same way fzf-colorizer.sh picks themes/fzf/.
#
# Both TUIs draw with the 16 ANSI colours, so the roles below are what they
# use each colour for, not what the colour is called.

# dirty-background from themes/nostromo.css -- keep in sync
background              #11111b
foreground              #d8cab8
background_opacity      1.0
cursor                  #CE6B29
selection_background    #CE6B29
selection_foreground    #11111b

# black: dark fills
color0   #11111b
# dark grey: the selected row -- a dark orange, since the text on it stays
# light and parchment on the full accent would be hard to read
color8   #7a4526

# red: errors
color1   #C4402B
color9   #d9573f

# green: the active panel's frame and title -> the accent, like wofi's frame
color2   #CE6B29
color10  #e07b3a

# yellow: column headers, warnings -> a mustard, close enough to the accent
# to belong with it and far enough to read as a second colour
color3   #D4A93F
color11  #E3BD5C

# blue: the key-hint line at the bottom, and the chosen button in bluetui's
# pairing dialog -> a steel blue, the one cool note against the orange. Kept
# mid-dark: it is text on the background in one place and a fill under
# light text in the other.
color4   #5285AD
color12  #6F9DC2

# magenta / cyan: only wlctl's speed test (upload / download labels)
color5   #A8709A
color13  #C592B8
color6   #4F9A94
color14  #6DB3AD

# white: plain text (7), and the text of the selected row (15) -- keep 15
# bright, it sits on the dark-orange selection. The inactive frames use the
# default foreground, so they cannot be dimmed without dimming all text.
color7   #9b9b9b
color15  #d8cab8
